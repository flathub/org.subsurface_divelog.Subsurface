# AI-generated (Claude)
name: Update Subsurface current

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch: {}

concurrency:
  group: subsurface-current-update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-manifest:
    if: github.repository_owner == 'flathub'
    runs-on: ubuntu-24.04
    steps:
      - name: Clone the manifest repository
        run: git clone "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" manifest

      # Only the Subsurface commit is pinned by this workflow. The build clones
      # nightly-builds in full and selects the matching build number itself, so
      # that pin is deliberately left alone.
      - name: Update the Subsurface source pin
        run: |
          set -eu

          subsurface_sha=$(git ls-remote \
            https://github.com/subsurface/subsurface.git refs/heads/current \
            | cut -f1)
          if ! printf '%s\n' "$subsurface_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Could not resolve the Subsurface current branch." >&2
            exit 1
          fi

          SUBSURFACE_SHA=$subsurface_sha python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("manifest/org.subsurface_divelog.Subsurface.yaml")
          text = path.read_text()
          url = "https://github.com/subsurface/subsurface"
          pattern = rf"(url: {re.escape(url)}\n\s*commit: )[0-9a-f]{{40}}"
          text, count = re.subn(pattern, rf"\g<1>{os.environ['SUBSURFACE_SHA']}", text)
          if count != 1:
              raise SystemExit(f"Expected exactly one pin for {url}, found {count}")
          path.write_text(text)
          PY

      - name: Create or update the Flatpak update pull request
        # peter-evans/create-pull-request v7.0.8
        uses: peter-evans/create-pull-request@v7.0.8
        with:
          path: manifest
          add-paths: org.subsurface_divelog.Subsurface.yaml
          branch: automation/subsurface-current
          delete-branch: true
          commit-message: 'Update Subsurface current'
          title: 'Update Subsurface current'
          body: |
            Update the Subsurface source pin to the current branch head.
